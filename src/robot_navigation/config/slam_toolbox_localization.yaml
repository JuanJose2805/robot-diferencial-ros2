# Parametros de slam_toolbox en modo LOCALIZACION para la navegacion (Nav2).
# Carga el grafo de poses guardado al mapear (maps/arena.posegraph y
# maps/arena.data) y solo calcula donde esta el robot dentro de ese mapa,
# publicando la TF map -> odom. Reemplaza a AMCL: en este robot AMCL perdia
# la ubicacion (correcciones de hasta 120 grados con odometria perfecta),
# mientras que el emparejamiento de escaneos de slam_toolbox demostro ser
# preciso durante el mapeo.
# Base: config/slam_toolbox.yaml (mapeo) con los cambios de
# mapper_params_localization.yaml de slam_toolbox (rama Foxy):
#   mode                          mapping -> localization
#   map_start_pose                [0, 0, 0]: el robot aparece en el origen
#                                 del mapa (map_file_name lo pone el launch)
#   scan_buffer_size              10 -> 3
#   loop_match_minimum_chain_size 10 -> 3
slam_toolbox:
  ros__parameters:

    # Plugin del optimizador del grafo de poses
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Marcos de referencia y topicos
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: localization
    map_start_pose: [0.0, 0.0, 0.0]

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02   # frecuencia de la TF map -> odom (50 Hz)
    map_update_interval: 2.0         # cada cuanto se republica /map (s)
    resolution: 0.05                 # tamano de celda del mapa (m)
    max_laser_range: 10.0            # alcance maximo usado para el mapa (m)
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    # Cuando se procesa un escaneo nuevo
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2     # m recorridos antes de agregar escaneo
    minimum_travel_heading: 0.3      # rad girados antes de agregar escaneo
    scan_buffer_size: 3
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true            # cierre de lazo: corrige la deriva
    loop_match_minimum_chain_size: 3
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlacion (busqueda del mejor ajuste del escaneo)
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Correlacion para el cierre de lazo
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Penalizaciones del scan matcher
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
